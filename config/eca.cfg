# ppcrecomp configuration for Emergency Call Ambulance (eca, Export).
#
# The fixed CROM (0xFF800000-0xFFFFFFFF) is always available to the recompiler.
#
# At boot the game copies its main program from CROM 0xFFC80000 to RAM 0x00000000.
# Verified against a Supermodel RAM dump: RAM 0x2000-0x180000 matches the CROM byte
# for byte (the first 8 KB holds the exception vectors the boot code rewrites, plus
# data). Recompiled RAM code is checked against RAM at run time, so a wrong guess
# here costs speed, not correctness.
ram_copy 0x00002000 0xFFC82000 0x17E000

# Reset vector (MSR[IP] is set at reset, so vectors start out at 0xFFF00000)
entry 0xFFF00100 reset
entry 0xFFF00300 dsi_vector
entry 0xFFF00500 external_irq_vector
entry 0xFFF00700 program_vector
entry 0xFFF00900 decrementer_vector
entry 0xFFF00C00 syscall_vector
entry 0xFFF01400 smi_vector

# RAM handlers the game installs (targets of the branches at RAM 0x500 and 0x900)
entry 0x000CD720 irq_handler
entry 0x000CD7F0 decrementer_handler
