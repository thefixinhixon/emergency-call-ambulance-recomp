
; ---------------------------------------------------------------------------
; Emergency Call Ambulance: Xbox-layout gamepad profile (added by the build).
; Supermodel's global defaults put Start on JOY1_BUTTON9 (the Guide button on
; an Xbox pad) and Coin on JOY1_BUTTON10 (left-stick click), and drive the
; pedals from the stick. SDL button numbering for these pads (BUTTONn = SDL
; button n-1): A=1 B=2 X=3 Y=4 LB=5 RB=6 Back=7 Start=8 Guide=9 LS=10 RS=11.
; Axes: left stick X/Y, LT=Z, right stick RX/RY, RT=RZ.
; Run "./eca eca.zip -config-inputs" to remap interactively.
; ---------------------------------------------------------------------------
[ eca ]
InputSystem = sdl                            ; mappings below use SDL joystick numbering
InputStart1 = "KEY_1,JOY1_BUTTON8"           ; Start
InputCoin1 = "KEY_3,JOY1_BUTTON7"            ; Back/View
InputSteering = "JOY1_XAXIS"                 ; left stick
InputAccelerator = "KEY_UP,JOY1_RZAXIS_POS"  ; right trigger
InputBrake = "KEY_DOWN,JOY1_ZAXIS_POS"       ; left trigger
InputGearShiftUp = "KEY_Y,JOY1_BUTTON6"      ; RB
InputGearShiftDown = "KEY_H,JOY1_BUTTON5"    ; LB
InputViewChange = "KEY_A,JOY1_BUTTON4"       ; Y
; Triggers rest at -32768 and travel to +32767, not centred at 0
InputJoy1ZOffVal = -32768
InputJoy1RZOffVal = -32768
